<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Useless Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Test element to verify CSS is loading */
        .test-element {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: blue;
            color: red;
            padding: 10px;
            z-index: 999;
            font-family: sans-serif;
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>
<body>
    <!-- Test element to verify page is loading -->
    <div class="test-element">If you see this text, CSS is loading correctly!</div>
    
    <!-- Background Image Container -->
    <div class="background-container"></div>
    
    <!-- Dice Container for p5.js -->
    <div id="dice-container"></div>
    
    <!-- Debug info to check paths -->
    <script>
        // Display currently loaded paths and errors
        window.addEventListener('load', function() {
            console.log("Page loaded, checking resources...");
            
            // Check if background image loaded
            const bgContainer = document.querySelector('.background-container');
            const computedStyle = window.getComputedStyle(bgContainer);
            const bgImage = computedStyle.backgroundImage;
            
            console.log("Background image path:", bgImage);
            
            // Create element to show debug info
            const debugElement = document.createElement('div');
            debugElement.style.position = 'absolute';
            debugElement.style.bottom = '10px';
            debugElement.style.left = '10px';
            debugElement.style.backgroundColor = 'rgba(0,0,0,0.7)';
            debugElement.style.color = 'white';
            debugElement.style.padding = '10px';
            debugElement.style.fontFamily = 'monospace';
            debugElement.style.zIndex = '1000';
            debugElement.innerHTML = `
                <p>Debug Info:</p>
                <p>Background image path: ${bgImage}</p>
                <p>Document location: ${window.location.href}</p>
                <p>Expected image path: /UselessClockAME/assets/images/FrankMiura.png</p>
            `;
            document.body.appendChild(debugElement);

            // Test image loading
            const img = new Image();
            img.onload = function() {
                console.log('Image loaded successfully!');
                debugElement.innerHTML += '<p style="color: green;">✓ Image loaded successfully!</p>';
            };
            img.onerror = function() {
                console.error('Failed to load image!');
                debugElement.innerHTML += '<p style="color: red;">✗ Failed to load image!</p>';
                debugElement.innerHTML += '<p>Please check if the image exists at: /UselessClockAME/assets/images/FrankMiura.png</p>';
            };
            img.src = '/UselessClockAME/assets/images/FrankMiura.png';
        });
    </script>
    
    <!-- Scripts -->
    <script src="js/sketch.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
