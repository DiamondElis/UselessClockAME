<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Useless Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>
<body>
    <!-- Page Container -->
    <div class="page-container">
        <!-- Background Image Container -->
        <div class="background-container"></div>
        
        <!-- Dice containers with more specific class names -->
        <div id="dice-container-1" class="dice-container am-pm-dice">
            <div id="dice-1-dot-container" class="dot-container"></div>
        </div>
        
        <div id="dice-container-2" class="dice-container tens-dice">
            <div id="dice-2-dot-container" class="dot-container"></div>
        </div>
        
        <div id="dice-container-3" class="dice-container ones-dice">
            <div id="dice-3-dot-container" class="dot-container"></div>
        </div>
    </div>
    
    <!-- Debug info to check paths -->
    <script>
        // Display currently loaded paths and errors
        window.addEventListener('load', function() {
            console.log("Page loaded, checking containers...");
            
            // Check if containers exist
            const containers = [
                document.getElementById('dice-container-1'),
                document.getElementById('dice-container-2'),
                document.getElementById('dice-container-3')
            ];
            
            containers.forEach((container, index) => {
                if (container) {
                    console.log(`Container ${index + 1} found:`, container);
                } else {
                    console.error(`Container ${index + 1} not found!`);
                }
            });
        });
    </script>
    
    <!-- Scripts -->
    <script src="js/sketch.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
